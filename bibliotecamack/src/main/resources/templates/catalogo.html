<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo Digital - Biblioteca Mackenzie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand" href="#">📚 Catálogo Mackenzie</a>
            <span class="navbar-text text-white fw-bold" th:text="'Olá, ' + ${leitor.nome} + ' (RA: ' + ${leitor.registroAcademico} + ')'">Olá, Aluno</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${sucesso}">Sucesso</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card p-3 mb-4 shadow-sm border-0">
            <form th:action="@{/biblioteca/usuario/catalogo/filtrar}" method="GET" class="row g-3 align-items-end">
                <input type="hidden" name="leitorId" th:value="${leitor.id}">
                
                <div class="col-md-5">
                    <label class="form-label fw-bold">Filtrar por Categoria / Gênero</label>
                    <select name="categoriaId" class="form-select">
                        <option value="">Todas as categorias...</option>
                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                    </select>
                </div>
                
                <div class="col-md-5">
                    <label class="form-label fw-bold">Filtrar por Autor / Escritor</label>
                    <select name="autorId" class="form-select">
                        <option value="">Todos os autores...</option>
                        <option th:each="aut : ${autores}" th:value="${aut.id}" th:text="${aut.nome}"></option>
                    </select>
                </div>
                
                <div class="col-md-2">
                    <button type="submit" class="btn btn-dark w-100">Aplicar Filtros</button>
                </div>
            </form>
        </div>

        <h4 class="mb-3 fw-bold">Livros Disponíveis para Empréstimo</h4>
        <div class="row g-4">
            <div class="col-md-4" th:each="livro : ${livros}">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body d-flex flex-column justify-content-between p-4">
                        <div>
                            <span class="badge bg-secondary mb-2" th:text="${livro.categoria != null ? livro.categoria.nome : 'Geral'}">Categoria</span>
                            <h5 class="card-title fw-bold mb-1" th:text="${livro.titulo}">Título do Livro</h5>
                            <p class="text-muted small mb-3" th:text="'Por: ' + ${livro.autor != null ? livro.autor.nome : 'Autor Desconhecido'}">Nome do Autor</p>
                            <hr>
                            <p class="card-text text-muted small" th:text="'ISBN: ' + ${livro.isbn}"></p>
                            <p class="card-text text-muted small" th:text="'Editora: ' + ${livro.editora}"></p>
                        </div>
                        
                        <form th:action="@{/biblioteca/usuario/solicitar-emprestimo}" method="POST" class="mt-3">
                            <input type="hidden" name="leitorId" th:value="${leitor.id}">
                            <input type="hidden" name="livroId" th:value="${livro.id}">
                            <button type="submit" class="btn btn-success w-100 py-2">Solicitar Empréstimo</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-12 text-center my-5" th:if="${#lists.isEmpty(livros)}">
                <p class="lead text-muted">Nenhum livro encontrado para os filtros selecionados.</p>
                <a th:href="@{/biblioteca/usuario/catalogo(registroAcademico=${leitor.registroAcademico})}" class="btn btn-outline-danger btn-sm">Limpar Filtros</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
