<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros - Biblioteca Mackenzie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <a href="/biblioteca" class="btn btn-secondary mb-3">← Voltar ao Menu</a>
        
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Adicionar Novo Livro (via Open Library API)</h4>
            </div>
            <div class="card-body">
                <form action="/biblioteca/livros/salvar" method="POST" class="row g-3">
                    <div class="col-md-8">
                        <label for="isbn" class="form-label">Digite o ISBN do Livro:</label>
                        <input type="text" id="isbn" name="isbn" class="form-control" placeholder="Ex: 0451526538" required>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Buscar e Cadastrar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Livros no Acervo</h4>
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>ISBN</th>
                            <th>Editora</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="livro : ${livros}">
                            <td th:text="${livro.id}">1</td>
                            <td th:text="${livro.titulo}">Título Exemplo</td>
                            <td th:text="${livro.isbn}">123456</td>
                            <td th:text="${livro.editora != null ? livro.editora : 'Não informada'}">Editora</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
