<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Biblioteca Mackenzie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-danger">Mack Biblioteca</h3>
            <p class="text-muted">Crie seu cadastro para acessar o acervo</p>
        </div>

        <form th:action="@{/cadastro/salvar}" th:object="${leitor}" method="POST">
            <div class="mb-3">
                <label class="form-label">Nome Completo</label>
                <input type="text" th:field="*{nome}" class="form-control" placeholder="Ex: Julia Araujo" required>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="Ex: julia@mackenzie.br" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Registro Acadêmico (RA)</label>
                <input type="text" th:field="*{registroAcademico}" class="form-control" placeholder="Ex: 324XXXXX" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 py-2">Cadastrar</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/login}" href="/login" class="text-decoration-none text-muted small">Já tem cadastro? Entre aqui</a>
        </div>
    </div>
</body>
</html>
