<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acesso do Aluno - Biblioteca Mackenzie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-danger">Mack Biblioteca</h3>
            <p class="text-muted">Área de Empréstimos Online</p>
        </div>
        
        <div th:if="${erro}" class="alert alert-danger text-center" th:text="${erro}"></div>

        <form th:action="@{/biblioteca/usuario/catalogo}" method="POST">
            <div class="mb-3">
                <label class="form-label">Digite o seu RA (Registro Académico):</label>
                <input type="text" name="registroAcademico" class="form-control" placeholder="Ex: 324XXXXX" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 py-2">Entrar no Catálogo</button>
        </form>
        <div class="text-center mt-3">
            <a href="/biblioteca/leitores" class="text-decoration-none text-muted small">Não tem registo? Cadastre-se aqui</a>
        </div>
    </div>
</body>
</html>
